<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | Bloom Kitchen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="panel narrow">

    <a href="index.html" class="brand">
        <span class="brand-icon">❀</span>
        Bloom Kitchen
    </a>

    <p class="eyebrow">BLOOM KITCHEN TEAM PORTAL</p>
    <h1>Welcome Back!</h1>

    <p class="muted">Sign in to access your staff dashboard.</p>

    <form id="loginForm">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" required>

        <button class="btn">Sign In →</button>
    </form>

    <p id="message" class="notice" aria-live="polite"></p>

    <p style="margin-top:20px;font-size:13px">
        <a href="index.html">← Back to Home</a>
    </p>

</main>

<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
